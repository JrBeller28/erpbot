on:
  workflow_dispatch:
    inputs:
      docNumber:
        description: 'Nomor Dokumen MM untuk di-scrape'
        required: true
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # ... langkah-langkah sebelumnya ...
      - name: Jalankan Bot
        env:
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          GAS_URL: ${{ secrets.GAS_URL }}
          DOC_NUMBER: ${{ github.event.inputs.docNumber }} # Ambil input dari GAS
        run: node erp_bot.js
